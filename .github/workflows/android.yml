name: Android release (AAB)
# Manual run. Produces a signed AAB if signing secrets exist, otherwise an UNSIGNED AAB + debug APK.
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  base64 -w0 android/release.keystore   (made by scripts/make-keystore.sh)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      version_name: {description: 'versionName (e.g. 1.0.0)', required: true, default: '1.0.0'}
      version_code: {description: 'versionCode (integer, must increase every upload)', required: true, default: '1'}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci && npx vite build && npx cap sync android
      - name: Restore keystore
        env: {KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/release.keystore; echo "ANDROID_KEYSTORE_FILE=$PWD/android/release.keystore" >> $GITHUB_ENV; fi
      - name: Gradle
        working-directory: android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noor-quran-android-${{ inputs.version_name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
