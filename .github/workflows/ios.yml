name: iOS build (TestFlight)
# Manual run on a GitHub macOS runner - no Mac needed. Requires an Apple Developer account ($99/yr).
# Required secrets:
#   IOS_CERT_P12_BASE64      Apple Distribution certificate exported as .p12, base64-encoded
#   IOS_CERT_PASSWORD        password of that .p12
#   IOS_PROFILE_BASE64       App Store provisioning profile (.mobileprovision) for the bundle id, base64
#   IOS_TEAM_ID              10-char Apple Team ID
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64   App Store Connect API key (for TestFlight upload)
on:
  workflow_dispatch:
    inputs:
      version_name: {description: 'Marketing version (e.g. 1.0.0)', required: true, default: '1.0.0'}
      build_number: {description: 'Build number (must increase)', required: true, default: '1'}
      upload: {description: 'Upload to TestFlight', type: boolean, default: true}
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npx vite build && npx cap sync ios
      - name: Install certificate + profile
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain; KCPW=$(uuidgen)
          echo "$P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KCPW" $KC && security set-keychain-settings -lut 21600 $KC && security unlock-keychain -p "$KCPW" $KC
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PW" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" $KC
          security list-keychain -d user -s $KC
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > $RUNNER_TEMP/p.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/p.mobileprovision)")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/p.mobileprovision)")
          cp $RUNNER_TEMP/p.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV
      - name: Archive
        working-directory: ios/App
        run: |
          BUNDLE_ID=$(node -p "require('../../capacitor.config.json').appId")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            MARKETING_VERSION=${{ inputs.version_name }} CURRENT_PROJECT_VERSION=${{ inputs.build_number }} \
            DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          cat > $RUNNER_TEMP/export.plist <<P
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
          <key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict></dict></plist>
          P
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out
      - uses: actions/upload-artifact@v4
        with:
          name: noor-quran-ios-${{ inputs.version_name }}
          path: ${{ runner.temp }}/out/*.ipa
      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f $RUNNER_TEMP/out/*.ipa --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER_ID
